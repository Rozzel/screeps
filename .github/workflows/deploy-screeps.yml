name: Deploy to Screeps

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Write screeps.json
        env:
          SCREEPS_TOKEN: ${{ secrets.SCREEPS_TOKEN }}
          SCREEPS_BRANCH: ${{ secrets.SCREEPS_BRANCH }}
        run: |
          test -n "$SCREEPS_TOKEN"
          python3 - <<'PY'
          import json, os
          cfg = {
            "main": {
              "token": os.environ["SCREEPS_TOKEN"],
              "protocol": "https",
              "hostname": "screeps.com",
              "port": 443,
              "path": "/",
              "branch": os.environ.get("SCREEPS_BRANCH") or "main",
            }
          }
          with open("screeps.json", "w", encoding="utf-8") as f:
              json.dump(cfg, f)
          PY

      - name: Build and push to Screeps
        run: make push-main
